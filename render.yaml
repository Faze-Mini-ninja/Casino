# Render Blueprint — https://render.com/docs/blueprint-spec
# FREE plan: no persistent disk, so the database resets whenever the service restarts or sleeps (after ~15 min idle).
# Accounts in SEED_USERS (and the admin) are recreated automatically on every start.
# To keep data: change plan to "starter" and uncomment the disk block.
services:
  - type: web
    name: krush-casino
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # disk:
    #   name: krush-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # you type it in when creating the Blueprint
      - key: SEED_USERS
        sync: false
      # Master key for every deposit wallet and the hot wallet. Generated once by Render and kept; never change it
      # after real deposits, or older deposit addresses can no longer be swept.
      - key: MASTER_SEED
        generateValue: true
      # Deposits run on free test networks (SOL, USDC, ETH, LTC) by default. SOLANA_CLUSTER is deliberately not set
      # here: set it in the Render dashboard (mainnet-beta for real money) so a Blueprint sync never switches it back.
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
